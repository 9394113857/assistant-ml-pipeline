name: "Dynamic SQL Runner - Manual Only"

# This workflow runs ONLY when a user clicks "Run workflow".
# Commits, pushes, pull requests, schedules, and other workflows never trigger it.

on:
  workflow_dispatch:
    inputs:
      sql_query:
        description: "MANDATORY: Paste one or more SELECT queries"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute-sql:
    name: Execute user-provided read-only SQL
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Validate mandatory SQL input
        env:
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          if [ -z "$(echo "$SQL_QUERY" | tr -d '[:space:]')" ]; then
            echo "::error::SQL input is mandatory. Exiting."
            exit 1
          fi
          echo "SQL input received."

      - name: Install SQL dependencies
        run: |
          python -m pip install --quiet psycopg2-binary pglast sqlparse

      - name: Execute dynamic read-only SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2
          import sqlparse
          from pglast import parse_sql, ast

          query = os.environ.get("SQL_QUERY", "").strip()
          database_url = os.environ.get("DATABASE_URL", "").strip()
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def fail(message):
              with open(summary_path, "a", encoding="utf-8") as report:
                  report.write("# Dynamic SQL Results\\n\\n")
                  report.write("**Status:** FAILED\\n\\n")
                  report.write(f"**Error:** {message}\\n")
              print(f"::error::{message}")
              sys.exit(1)

          def markdown_value(value):
              if value is None:
                  return "NULL"
              return (
                  str(value)
                  .replace("|", "\\\\|")
                  .replace("\\r", "")
                  .replace("\\n", "<br>")
              )

          # Validate the required runtime inputs.
          if not query:
              fail("SQL input is empty. Paste a SQL query and run manually.")

          if not database_url:
              fail("The repository DATABASE_URL secret is missing.")

          # Split the supplied script with sqlparse.
          # pglast.split() is intentionally not used here.
          try:
              statements = [
                  statement.strip()
                  for statement in sqlparse.split(query)
                  if statement.strip()
              ]
          except Exception as error:
              fail(f"Could not split SQL input: {error}")

          if not statements:
              fail(
                  "No SQL statements were detected. Paste complete "
                  "SELECT statements, each terminated with a semicolon."
              )

          # Parse and validate EVERY statement before opening a DB connection.
          for index, statement in enumerate(statements, start=1):
              try:
                  parsed = parse_sql(statement)
              except Exception as error:
                  fail(f"SQL statement {index} is invalid: {error}")

              if len(parsed) != 1:
                  fail(
                      f"SQL statement {index} must contain exactly "
                      "one command."
                  )

              if not isinstance(parsed[0].stmt, ast.SelectStmt):
                  fail(
                      f"SQL statement {index} is not a SELECT. "
                      "Only SELECT and WITH ... SELECT are permitted."
                  )

          connection = None

          try:
              # Reuse the existing DATABASE_URL repository secret.
              connection = psycopg2.connect(
                  database_url,
                  connect_timeout=10,
                  sslmode="require"
              )

              # Enforce a read-only PostgreSQL transaction.
              connection.set_session(readonly=True, autocommit=False)
              cursor = connection.cursor()

              # Collect results first so failed runs do not show a false SUCCESS.
              result_sections = []

              for index, statement in enumerate(statements, start=1):
                  cursor.execute("SET LOCAL statement_timeout = '25s'")
                  cursor.execute(statement)

                  if cursor.description is None:
                      raise RuntimeError(
                          f"Query {index} returned no result columns."
                      )

                  columns = [column.name for column in cursor.description]
                  rows = cursor.fetchmany(501)
                  truncated = len(rows) > 500
                  rows = rows[:500]

                  section = []
                  section.append(f"## Query {index}\\n")
                  section.append(f"**Rows returned:** {len(rows)}\\n")

                  if truncated:
                      section.append(
                          "**Note:** Displaying the first 500 rows.\\n"
                      )

                  section.append(
                      "| " + " | ".join(
                          markdown_value(column) for column in columns
                      ) + " |"
                  )
                  section.append(
                      "| " + " | ".join(["---"] * len(columns)) + " |"
                  )

                  if not rows:
                      section.append(
                          "| " + " | ".join(
                              ["No rows returned"] + [""] * (len(columns) - 1)
                          ) + " |"
                      )
                  else:
                      for row in rows:
                          section.append(
                              "| " + " | ".join(
                                  markdown_value(value) for value in row
                              ) + " |"
                          )

                  result_sections.append("\\n".join(section))

              # Discard the read-only transaction after all queries succeed.
              connection.rollback()
              cursor.close()

              with open(summary_path, "a", encoding="utf-8") as report:
                  report.write("# Dynamic SQL Results\\n\\n")
                  report.write("**Status:** SUCCESS\\n\\n")
                  report.write("**Execution mode:** Read-only transaction\\n\\n")
                  report.write(
                      f"**Queries executed:** {len(statements)}\\n\\n"
                  )
                  report.write("\\n\\n".join(result_sections))
                  report.write("\\n")

              print(f"Successfully executed {len(statements)} SELECT query(s).")

          except Exception as error:
              if connection:
                  connection.rollback()
              fail(f"{type(error).__name__}: {error}")

          finally:
              if connection:
                  connection.close()
          PY
