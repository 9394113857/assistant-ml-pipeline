
name: "Dynamic SQL Runner"

on:
  workflow_dispatch:
    inputs:
      sql_query:
        description: "MANDATORY: Paste your SQL SELECT query here"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      # STEP 1: Reject empty input immediately.
      - name: Validate SQL input
        env:
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          if [ -z "$(echo "$SQL_QUERY" | tr -d '[:space:]')" ]; then
            echo "::error::SQL input is mandatory. Workflow stopped."
            exit 1
          fi

          echo "SQL input received."

      # STEP 2: Install required libraries.
      - name: Install Python dependencies
        run: |
          pip install --quiet psycopg2-binary pglast

      # STEP 3: Execute the user-provided SQL dynamically.
      - name: Execute read-only SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2
          from pglast import parse_sql, ast

          query = os.environ.get("SQL_QUERY", "").strip()
          database_url = os.environ.get("DATABASE_URL", "").strip()

          output = "sql-result.md"

          def fail(message):
              with open(output, "w") as f:
                  f.write("# Dynamic SQL Result\n\n")
                  f.write("**Status:** FAILED\n\n")
                  f.write(f"**Reason:** {message}\n")
              print(f"::error::{message}")
              sys.exit(1)

          # Mandatory input validation.
          if not query:
              fail("SQL query is empty. Please provide SQL input.")

          if not database_url:
              fail("DATABASE_URL GitHub Secret is missing.")

          # Accept exactly one SELECT or WITH ... SELECT statement.
          try:
              statements = parse_sql(query)
          except Exception as e:
              fail(f"Invalid SQL: {e}")

          if len(statements) != 1:
              fail("Only one SQL statement is permitted.")

          if not isinstance(statements[0].stmt, ast.SelectStmt):
              fail("Only SELECT or WITH ... SELECT queries are allowed.")

          connection = None

          try:
              connection = psycopg2.connect(
                  database_url,
                  connect_timeout=10,
                  sslmode="require"
              )

              connection.set_session(
                  readonly=True,
                  autocommit=False
              )

              cursor = connection.cursor()
              cursor.execute("SET LOCAL statement_timeout = '30s'")

              # The query comes entirely from the workflow input.
              cursor.execute(query)

              if cursor.description is None:
                  fail("Query returned no result columns.")

              columns = [c.name for c in cursor.description]
              rows = cursor.fetchmany(501)
              truncated = len(rows) > 500
              rows = rows[:500]

              def fmt(value):
                  if value is None:
                      return "NULL"
                  return (
                      str(value)
                      .replace("|", "\\|")
                      .replace("\n", "<br>")
                      .replace("\r", "")
                  )

              with open(output, "w", encoding="utf-8") as f:
                  f.write("# Dynamic SQL Result\n\n")
                  f.write("**Status:** SUCCESS\n\n")
                  f.write("**Execution:** Read-only transaction\n\n")
                  f.write(f"**Rows returned:** {len(rows)}\n\n")

                  if truncated:
                      f.write("**Note:** Showing first 500 rows.\n\n")

                  f.write("| " + " | ".join(map(fmt, columns)) + " |\n")
                  f.write("| " + " | ".join(["---"] * len(columns)) + " |\n")

                  for row in rows:
                      f.write(
                          "| " + " | ".join(fmt(v) for v in row) + " |\n"
                      )

                  if not rows:
                      f.write(
                          "| " + " | ".join(
                              ["No rows returned"] + [""] * (len(columns)-1)
                          ) + " |\n"
                      )

              connection.rollback()
              cursor.close()

              print("SQL executed successfully.")
              print(f"Rows returned: {len(rows)}")

          except Exception as e:
              if connection:
                  connection.rollback()
              fail(f"{type(e).__name__}: {e}")

          finally:
              if connection:
                  connection.close()
          PY

      # STEP 4: Display results directly in GitHub Actions.
      - name: Publish result in Actions Summary
        if: always()
        run: |
          if [ -f sql-result.md ]; then
            cat sql-result.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # STEP 5: Keep a downloadable Markdown result.
      - name: Upload Markdown result
        if: always() && hashFiles('sql-result.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-sql-result
          path: sql-result.md
          retention-days: 7
