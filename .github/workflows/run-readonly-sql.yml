
import os
import sys
import psycopg2
from pglast import parse_sql, split, ast

query = os.environ.get("SQL_QUERY", "").strip()
database_url = os.environ.get("DATABASE_URL", "").strip()
output = "sql-result.md"
MAX_ROWS = 500

def fail(message):
    with open(output, "w", encoding="utf-8") as f:
        f.write("# Dynamic SQL Result\n\n")
        f.write("**Status:** FAILED\n\n")
        f.write(f"**Reason:** {message}\n")
    print(f"::error::{message}")
    sys.exit(1)

def fmt(value):
    if value is None:
        return "NULL"
    return (
        str(value)
        .replace("|", "\\|")
        .replace("\n", "<br>")
        .replace("\r", "")
    )

# 1. Validate mandatory inputs.
if not query:
    fail("SQL input is empty.")

if not database_url:
    fail("DATABASE_URL GitHub Secret is missing.")

# 2. Split the supplied SQL script into individual statements.
try:
    statements = [s.strip() for s in split(query) if s.strip()]
except Exception as error:
    fail(f"SQL parsing failed: {error}")

if not statements:
    fail("No SQL statements found.")

# 3. Validate EVERY statement before executing ANY statement.
for index, statement in enumerate(statements, start=1):
    try:
        parsed = parse_sql(statement)
    except Exception as error:
        fail(f"Statement {index} is invalid: {error}")

    if len(parsed) != 1:
        fail(f"Statement {index} contains unexpected multiple commands.")

    if not isinstance(parsed[0].stmt, ast.SelectStmt):
        fail(
            f"Statement {index} is not SELECT. "
            "Only SELECT and WITH ... SELECT are permitted."
        )

connection = None

try:
    # 4. Connect using the existing GitHub DATABASE_URL secret.
    connection = psycopg2.connect(
        database_url,
        connect_timeout=10,
        sslmode="require"
    )

    # 5. Enforce read-only transaction.
    connection.set_session(readonly=True, autocommit=False)

    cursor = connection.cursor()

    with open(output, "w", encoding="utf-8") as f:
        f.write("# Dynamic SQL Audit Results\n\n")
        f.write("**Status:** SUCCESS\n\n")
        f.write("**Execution mode:** Read-only transaction\n\n")
        f.write(f"**SQL statements:** {len(statements)}\n\n")

        # 6. Execute every validated SELECT statement.
        for index, statement in enumerate(statements, start=1):
            f.write(f"## Query {index}\n\n")

            cursor.execute("SET LOCAL statement_timeout = '30s'")
            cursor.execute(statement)

            if cursor.description is None:
                fail(f"Query {index} returned no result columns.")

            columns = [column.name for column in cursor.description]
            rows = cursor.fetchmany(MAX_ROWS + 1)

            truncated = len(rows) > MAX_ROWS
            rows = rows[:MAX_ROWS]

            f.write(f"**Rows returned:** {len(rows)}\n\n")

            if truncated:
                f.write("**Note:** Showing first 500 rows.\n\n")

            f.write("| " + " | ".join(fmt(c) for c in columns) + " |\n")
            f.write("| " + " | ".join(["---"] * len(columns)) + " |\n")

            if not rows:
                f.write(
                    "| " + " | ".join(
                        ["No rows returned"] + [""] * (len(columns) - 1)
                    ) + " |\n"
                )
            else:
                for row in rows:
                    f.write(
                        "| " + " | ".join(fmt(v) for v in row) + " |\n"
                    )

            f.write("\n")

    # 7. Discard the read-only transaction.
    connection.rollback()
    cursor.close()

    print(f"Successfully executed {len(statements)} SELECT statements.")
    print(f"Results saved to {output}.")

except Exception as error:
    if connection:
        connection.rollback()

    fail(f"{type(error).__name__}: {error}")

finally:
    if connection:
        connection.close()
