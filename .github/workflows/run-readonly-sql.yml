
name: "Dynamic SQL Runner - Manual Only"

# ONLY manual execution.
# No push, pull_request, schedule or workflow_run triggers.

on:
  workflow_dispatch:
    inputs:
      sql_query:
        description: "MANDATORY: Paste your SQL query here"
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute-sql:
    name: Run user-provided read-only SQL
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      # STEP 1: Reject empty SQL immediately.
      - name: Validate mandatory SQL input
        env:
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          if [ -z "$(echo "$SQL_QUERY" | tr -d '[:space:]')" ]; then
            echo "::error::SQL input is mandatory. Exiting."
            exit 1
          fi

          echo "SQL input received."

      # STEP 2: Install only SQL execution dependencies.
      - name: Install dependencies
        run: |
          pip install --quiet psycopg2-binary pglast

      # STEP 3: Execute dynamically supplied SQL.
      - name: Execute read-only SQL queries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SQL_QUERY: ${{ inputs.sql_query }}
        run: |
          python - <<'PY'
          import os
          import sys
          import psycopg2
          from pglast import parse_sql, split, ast

          query = os.environ.get("SQL_QUERY", "").strip()
          database_url = os.environ.get("DATABASE_URL", "").strip()

          summary = os.environ["GITHUB_STEP_SUMMARY"]

          def fail(message):
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("# Dynamic SQL Runner\n\n")
                  f.write("**Status:** FAILED\n\n")
                  f.write(f"**Error:** {message}\n")
              print(f"::error::{message}")
              sys.exit(1)

          # 1. Validate user input.
          if not query:
              fail("SQL query is empty. Manual input is required.")

          if not database_url:
              fail("GitHub DATABASE_URL secret is missing.")

          # 2. Split the input into individual SQL statements.
          try:
              statements = [
                  statement.strip()
                  for statement in split(query)
                  if statement.strip()
              ]
          except Exception as error:
              fail(f"SQL parsing failed: {error}")

          if not statements:
              fail("No SQL statements supplied.")

          # 3. Validate every statement before executing any.
          for index, statement in enumerate(statements, start=1):
              try:
                  parsed = parse_sql(statement)
              except Exception as error:
                  fail(f"Invalid SQL statement {index}: {error}")

              if len(parsed) != 1:
                  fail(f"Statement {index}: multiple commands detected.")

              if not isinstance(parsed[0].stmt, ast.SelectStmt):
                  fail(
                      f"Statement {index}: only SELECT or "
                      "WITH ... SELECT is allowed."
                  )

          connection = None

          try:
              # 4. Connect using the existing repository secret.
              connection = psycopg2.connect(
                  database_url,
                  connect_timeout=10,
                  sslmode="require"
              )

              # 5. Enforce read-only transaction.
              connection.set_session(
                  readonly=True,
                  autocommit=False
              )

              cursor = connection.cursor()

              with open(summary, "a", encoding="utf-8") as report:

                  report.write("# Dynamic SQL Results\n\n")
                  report.write("**Status:** SUCCESS\n\n")
                  report.write("**Execution mode:** Read-only\n\n")
                  report.write(
                      f"**Queries supplied:** {len(statements)}\n\n"
                  )

                  # 6. Execute each user-provided SELECT query.
                  for index, statement in enumerate(statements, start=1):

                      cursor.execute(
                          "SET LOCAL statement_timeout = '30s'"
                      )

                      cursor.execute(statement)

                      if cursor.description is None:
                          fail(
                              f"Query {index} returned no result columns."
                          )

                      columns = [
                          column.name
                          for column in cursor.description
                      ]

                      rows = cursor.fetchmany(501)
                      truncated = len(rows) > 500
                      rows = rows[:500]

                      def fmt(value):
                          if value is None:
                              return "NULL"

                          return (
                              str(value)
                              .replace("|", "\\|")
                              .replace("\r", "")
                              .replace("\n", "<br>")
                          )

                      report.write(f"## Query {index}\n\n")
                      report.write(
                          f"**Rows returned:** {len(rows)}\n\n"
                      )

                      if truncated:
                          report.write(
                              "**Note:** Showing first 500 rows.\n\n"
                          )

                      report.write(
                          "| " +
                          " | ".join(fmt(column) for column in columns) +
                          " |\n"
                      )

                      report.write(
                          "| " +
                          " | ".join(["---"] * len(columns)) +
                          " |\n"
                      )

                      if not rows:
                          report.write(
                              "| " +
                              " | ".join(
                                  ["No rows returned"] +
                                  [""] * (len(columns) - 1)
                              ) +
                              " |\n"
                          )
                      else:
                          for row in rows:
                              report.write(
                                  "| " +
                                  " | ".join(fmt(value) for value in row) +
                                  " |\n"
                              )

                      report.write("\n")

              # 7. Discard the read-only transaction.
              connection.rollback()
              cursor.close()

              print("All SQL queries executed successfully.")

          except Exception as error:
              if connection:
                  connection.rollback()

              fail(
                  f"Database execution failed: "
                  f"{type(error).__name__}: {error}"
              )

          finally:
              if connection:
                  connection.close()

          PY
