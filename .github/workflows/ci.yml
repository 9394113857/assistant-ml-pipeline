name: 🧪 Assistant ML Pipeline CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🔍 Validate Python Syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "__pycache__"}
          files = [
              path for path in Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]
          if not files:
              raise SystemExit("No Python files found")

          for path in files:
              ast.parse(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} Python files")
          PY

      - name: 🧪 Run Unit Tests
        run: python -m unittest discover -s tests -v


  # Request merge only after this workflow's validation succeeds.
  # Scope: non-draft PRs targeting main; GitHub enforces configured
  # review/check requirements and the PR head SHA must still match.
  enable-auto-merge:
    name: 🤖 Enable Auto-Merge After CI
    runs-on: ubuntu-latest
    needs:
      - validate
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.draft == false
      && needs.validate.result == 'success'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout Repository for GitHub CLI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🤖 Enable Squash Auto-Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
          echo "✅ Auto-merge requested after successful ML Pipeline CI."
