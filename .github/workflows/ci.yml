name: 🧪 Assistant ML Pipeline CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: 🧪 ML Pipeline Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🔎 Check Dependency Consistency
        run: python -m pip check

      - name: 🔍 Validate Python Syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "__pycache__"}
          files = [
              path for path in Path(".").rglob("*.py")
              if not any(part in excluded for part in path.parts)
          ]
          if not files:
              raise SystemExit("No Python files found")

          for path in files:
              ast.parse(path.read_text(encoding="utf-8"))
          print(f"Validated {len(files)} Python files")
          PY

      - name: 🧪 Run Unit Tests
        run: python -m unittest discover -s tests -v

  # Request merge only after validation succeeds.
  # GitHub still enforces the repository's main-branch protection rules.
  enable-auto-merge:
    name: 🤖 Enable Auto-Merge After CI
    runs-on: ubuntu-latest
    needs:
      - validate
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.draft == false
      && needs.validate.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📥 Checkout Repository for GitHub CLI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 🤖 Enable Squash Auto-Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
          echo "✅ Auto-merge requested after successful ML Pipeline CI."

  # Email is informational only and must never block CI or auto-merge.
  notify-ci-result:
    name: 📧 Email PR CI Result
    runs-on: ubuntu-latest
    needs:
      - validate
      - enable-auto-merge
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'main'
    steps:
      - name: 📧 Send CI Result Email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          secure: true
          from: Assistant ML Pipeline CI
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          subject: "Assistant ML Pipeline PR CI - ${{ needs.validate.result }}"
          html_body: |
            <h2>Assistant ML Pipeline - Pull Request CI</h2>
            <table border="1" cellpadding="8" cellspacing="0">
              <tr><th align="left">Repository</th><td>${{ github.repository }}</td></tr>
              <tr><th align="left">Pull Request</th><td>#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}</td></tr>
              <tr><th align="left">Source Branch</th><td>${{ github.head_ref }}</td></tr>
              <tr><th align="left">Target Branch</th><td>${{ github.base_ref }}</td></tr>
              <tr><th align="left">Validation Result</th><td>${{ needs.validate.result }}</td></tr>
              <tr><th align="left">Auto-Merge Job</th><td>${{ needs.enable-auto-merge.result }}</td></tr>
              <tr><th align="left">Commit</th><td>${{ github.event.pull_request.head.sha }}</td></tr>
            </table>
            <p>Auto-merge is requested only after successful validation. GitHub applies the configured main-branch protection rules.</p>
            <p>This CI workflow does not build Docker images, create tags/releases, deploy to Render, or start ML training.</p>
            <p><a href="${{ github.event.pull_request.html_url }}">Open pull request</a> ·
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open workflow run</a></p>
